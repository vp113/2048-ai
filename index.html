<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2048</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game">
    <header class="header">
      <h1 class="title">2048</h1>
      <div class="scores">
        <div class="score-box">
          <div class="label">分数</div>
          <div class="value" id="score">0</div>
        </div>
        <div class="score-box">
          <div class="label">最高分</div>
          <div class="value" id="best">0</div>
        </div>
      </div>
    </header>

    <div class="controls">
      <p class="hint">合并数字，凑出 <strong>2048</strong>！</p>
      <div class="buttons">
        <button class="btn" id="undo" type="button">撤销</button>
        <button class="btn btn-primary" id="new-game" type="button">新游戏</button>
      </div>
    </div>

    <div class="board" id="board">
      <div class="cell-layer" id="cell-layer"></div>
      <div class="tile-layer" id="tile-layer"></div>
    </div>

    <section class="ai-panel">
      <div class="ai-head">
        <button class="btn btn-ai" id="ai-toggle" type="button">AI 开始</button>
        <div class="ai-sliders">
          <label class="slider">
            <span>深度</span>
            <input type="range" id="ai-depth" min="1" max="4" step="1" value="3">
            <b id="depth-val">3</b>
          </label>
          <label class="slider">
            <span>速度</span>
            <input type="range" id="ai-speed" min="0" max="100" step="1" value="60">
            <b id="speed-val">中</b>
          </label>
        </div>
      </div>
      <div class="ai-stats">
        <div class="stat"><span class="k">决策</span><span class="v" id="ai-decision">—</span></div>
        <div class="stat"><span class="k">节点</span><span class="v" id="ai-nodes">0</span></div>
        <div class="stat"><span class="k">步数</span><span class="v" id="ai-steps">0</span></div>
        <div class="stat"><span class="k">得分</span><span class="v" id="ai-score">0</span></div>
      </div>
      <p class="ai-note" id="ai-note"></p>
    </section>

    <p class="footer">方向键 / WASD 移动 · 手机可滑动 · AI 模式基于 Expectimax 搜索</p>
  </main>

  <div class="overlay" id="message">
    <div class="overlay-card">
      <h2 id="message-text">游戏结束</h2>
      <p class="sub" id="message-sub"></p>
      <div class="buttons">
        <button class="btn" id="keep-going" type="button">继续游戏</button>
        <button class="btn btn-primary" id="try-again" type="button">再来一局</button>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
  <script src="ai.js"></script>
  <script src="main.js"></script>
</body>
</html>
