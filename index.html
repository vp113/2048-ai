<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2048</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game">
    <header class="header">
      <h1 class="title">2048</h1>
      <div class="scores">
        <div class="score-box">
          <div class="label">分数</div>
          <div class="value" id="score">0</div>
        </div>
        <div class="score-box">
          <div class="label">最高分</div>
          <div class="value" id="best">0</div>
        </div>
        <div class="score-box">
          <div class="label">最大方块</div>
          <div class="value" id="max-tile">0</div>
        </div>
      </div>
    </header>

    <div class="controls">
      <p class="hint">高性能 Expectimax AI · 自动游玩</p>
      <div class="buttons">
        <button class="btn btn-ai" id="ai-toggle" type="button">AI 开始</button>
        <button class="btn" id="restart" type="button">重新开始</button>
        <button class="btn" id="import-replay" type="button">导入回放</button>
        <input type="file" id="replay-file" accept=".json,application/json" hidden>
      </div>
    </div>

    <div class="speed-row">
      <span class="speed-label">速度</span>
      <div class="segmented" id="speed">
        <button type="button" data-speed="3">3/秒</button>
        <button type="button" data-speed="5">5/秒</button>
        <button type="button" data-speed="8" class="active">8/秒</button>
        <button type="button" data-speed="12">12/秒</button>
        <button type="button" data-speed="20">20/秒</button>
      </div>
      <label class="auto-toggle">
        <input type="checkbox" id="auto-continue">
        自动连续挑战
      </label>
      <span class="session" id="session">第 1 局 · 已完成 0 局</span>
    </div>

    <p class="import-note" id="import-note" hidden></p>

    <section class="final-banner" id="final-banner" hidden aria-live="polite">
      <div class="final-head">
        <strong class="final-title">本局结束</strong>
        <span class="final-achievement" id="final-achievement"></span>
      </div>
      <div class="final-stats">
        <span>得分 <b id="final-score">0</b></span>
        <span>最大方块 <b id="final-max">0</b></span>
        <span>步数 <b id="final-moves">0</b></span>
      </div>
      <div class="final-actions">
        <span class="final-note" id="final-note"></span>
        <button class="btn btn-primary" id="next-game" type="button">下一局</button>
      </div>
    </section>

    <div class="board" id="board">
      <div class="cell-layer" id="cell-layer"></div>
      <div class="tile-layer" id="tile-layer"></div>
    </div>

    <section class="replay-panel" id="replay-panel" hidden>
      <div class="replay-head">
        <strong>回放模式</strong>
        <span class="replay-source" id="replay-source"></span>
        <button class="btn btn-small" id="replay-exit" type="button">退出回放</button>
      </div>
      <div class="replay-scrub">
        <button class="btn btn-small" id="replay-start" type="button" title="跳到开局">|◀</button>
        <button class="btn btn-small" id="replay-prev" type="button" title="上一步">◀</button>
        <button class="btn btn-small replay-play" id="replay-play" type="button">播放</button>
        <button class="btn btn-small" id="replay-next" type="button" title="下一步">▶</button>
        <button class="btn btn-small" id="replay-end" type="button" title="跳到结局">▶|</button>
        <input type="range" id="replay-progress" min="0" max="0" value="0" step="1">
        <span class="replay-counter" id="replay-counter">0 / 0</span>
      </div>
      <div class="replay-meta">
        <span>得分 <b id="replay-score">0</b></span>
        <span>最大方块 <b id="replay-max">0</b></span>
        <label>速度
          <select id="replay-speed">
            <option value="2">2 步/秒</option>
            <option value="5" selected>5 步/秒</option>
            <option value="10">10 步/秒</option>
            <option value="20">20 步/秒</option>
          </select>
        </label>
      </div>
      <p class="replay-note" id="replay-note">导入后默认显示最终棋盘；拖动进度条查看任意一步。</p>
    </section>

    <div class="statusbar">
      <span class="status" id="ai-status">正在连接 AI 服务…</span>
      <span class="achievements" id="achievements"></span>
    </div>

    <div class="footer">
      <span>
        AI: <a href="https://github.com/macroxue/2048-ai" target="_blank" rel="noopener">macroxue/2048-ai</a>
        · GPL-3.0 · depth 3
      </span>
      <a id="replay-download" class="link" href="#" hidden>下载最佳回放</a>
    </div>
  </main>

  <div class="toast" id="toast" role="status"></div>

  <script src="game.js"></script>
  <script src="replay.js"></script>
  <script src="ai-client.js"></script>
  <script src="main.js"></script>
</body>
</html>
