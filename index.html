<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2048</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game">
    <header class="header">
      <h1 class="title">2048</h1>
      <div class="scores">
        <div class="score-box">
          <div class="label">分数</div>
          <div class="value" id="score">0</div>
        </div>
        <div class="score-box">
          <div class="label">最高分</div>
          <div class="value" id="best">0</div>
        </div>
        <div class="score-box">
          <div class="label">最大方块</div>
          <div class="value" id="max-tile">0</div>
        </div>
      </div>
    </header>

    <div class="controls">
      <p class="hint">高性能 Expectimax AI · 自动游玩</p>
      <div class="buttons">
        <button class="btn btn-ai" id="ai-toggle" type="button">AI 开始</button>
        <button class="btn" id="restart" type="button">重新开始</button>
      </div>
    </div>

    <div class="speed-row">
      <span class="speed-label">速度</span>
      <div class="segmented" id="speed">
        <button type="button" data-speed="3">3/秒</button>
        <button type="button" data-speed="5">5/秒</button>
        <button type="button" data-speed="8" class="active">8/秒</button>
        <button type="button" data-speed="12">12/秒</button>
        <button type="button" data-speed="20">20/秒</button>
      </div>
      <span class="session" id="session">第 1 局 · 已完成 0 局</span>
    </div>

    <div class="board" id="board">
      <div class="cell-layer" id="cell-layer"></div>
      <div class="tile-layer" id="tile-layer"></div>
    </div>

    <div class="statusbar">
      <span class="status" id="ai-status">正在连接 AI 服务…</span>
      <span class="achievements" id="achievements"></span>
    </div>

    <div class="footer">
      <span>
        AI: <a href="https://github.com/macroxue/2048-ai" target="_blank" rel="noopener">macroxue/2048-ai</a>
        · GPL-3.0 · depth 3
      </span>
      <a id="replay-download" class="link" href="#" hidden>下载最佳回放</a>
    </div>
  </main>

  <div class="toast" id="toast" role="status"></div>

  <div class="overlay" id="message">
    <div class="overlay-card">
      <h2 id="message-text">本局结束</h2>
      <p class="sub" id="message-sub"></p>
      <div class="buttons">
        <button class="btn btn-primary" id="message-action" type="button">继续挑战</button>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
  <script src="ai-client.js"></script>
  <script src="main.js"></script>
</body>
</html>
